<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hey Mimi 🎀</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;overflow:hidden;background:linear-gradient(135deg,#ffd1dc,#e8d5ff,#cdefff)}
#opening{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:linear-gradient(135deg,#ffb6c9,#d9b3ff);z-index:10;transition:1s}
#opening h1{font-size:48px;color:white;margin:10px;animation:bounce 1.5s infinite}#opening p{color:white;font-size:18px}
button{border:0;padding:14px 28px;border-radius:30px;font-size:17px;cursor:pointer;margin-top:18px;background:white;color:#d64f91;box-shadow:0 6px 20px #0002}
#main{display:none;min-height:100vh;justify-content:center;align-items:center;padding:20px}.card{width:92%;max-width:430px;text-align:center;padding:30px 22px;background:#fffffff0;border-radius:28px;box-shadow:0 15px 45px #0003;animation:pop .8s ease}.card h1{color:#e44d91;font-size:34px}.card h2{color:#9b59b6}.message{min-height:115px;display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1.6;color:#444}
#surprise{display:none;animation:pop .7s ease}.bigHeart{font-size:65px;animation:heartbeat 1s infinite}.heart,.sparkle{position:fixed;pointer-events:none;z-index:20}.heart{bottom:-50px;animation:floatUp linear forwards}.sparkle{animation:sparkle 1.5s ease-out forwards}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}@keyframes heartbeat{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}@keyframes floatUp{from{transform:translateY(0) rotate(0);opacity:1}to{transform:translateY(-110vh) rotate(360deg);opacity:0}}@keyframes sparkle{from{transform:scale(0);opacity:1}to{transform:scale(1.8);opacity:0}}
</style>
</head>
<body>
<div id="opening"><h1>Hey Mimi 🎀</h1><p>Someone has a little surprise for you... 👀</p><button onclick="start()">💌 Open It</button></div>
<div id="main"><div class="card">
<h1>Hey Mimi 🎀</h1><h2>My Favourite Bestie 😂❤️</h2>
<div class="message" id="message">Ready for some bestie-level nonsense? 😂</div>
<button id="next" onclick="next()">✨ Next</button>
<div id="surprise"><div class="bigHeart">💖</div><h2>Okay Mimi...</h2><p>You're officially stuck with this friendship. 😂<br><br>No refunds. ❌<br>No cancellation. ❌<br><br><b>Lifetime Bestie Subscription Activated! ♾️🎀</b></p><button onclick="location.reload()">🔄 Again</button></div>
</div></div>
<script>
const messages=[
"Mimi 🎀... pehle toh ek important baat hai 👀",
"Tu thodi si pagal hai... 😂",
"Thodi nahi... okay, kaafi zyada. 🤡😂",
"Lekin honestly, tere jaisi bestie milna lucky hai. 🫶",
"Random talks + stupid jokes + endless masti = BESTIE ENERGY 😂❤️",
"Aur haan Mimi... ek secret hai 🤫",
"Tu meri favourite notification hai. 🎀📱",
"Okay okay... ab actual surprise ke liye ready ho ja! 👀✨"];
let i=0;
function start(){document.getElementById("opening").style.opacity=0;setTimeout(()=>{document.getElementById("opening").style.display="none";document.getElementById("main").style.display="flex";hearts()},900)}
function next(){if(i<messages.length){document.getElementById("message").innerHTML=messages[i++];sparkles()}else{document.getElementById("next").style.display="none";document.getElementById("message").style.display="none";document.getElementById("surprise").style.display="block";hearts()}}
function hearts(){for(let n=0;n<18;n++){let x=document.createElement("div");x.className="heart";x.innerHTML=Math.random()>.5?"💖":"🎀";x.style.left=Math.random()*100+"vw";x.style.fontSize=18+Math.random()*25+"px";x.style.animationDuration=4+Math.random()*4+"s";document.body.appendChild(x);setTimeout(()=>x.remove(),8000)}}
function sparkles(){for(let n=0;n<12;n++){let x=document.createElement("div");x.className="sparkle";x.innerHTML="✨";x.style.left=Math.random()*100+"vw";x.style.top=Math.random()*100+"vh";document.body.appendChild(x);setTimeout(()=>x.remove(),1500)}}
</script>
</body>
</html>
